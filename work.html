    <style>
      .group {
        visibility: hidden;

      .display {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .display::-webkit-scrollbar {
        display: none;
      }

      .display {
        height: 100dvh;
        background-color: var(--bg-dark);
        color: var(--text-light);
        font-family: "Satoshi", sans-serif;
        font-weight: var(--text-weight);
        line-height: 1.5em;
        overflow: hidden;
      }

      .hidden-box {
        transform: scaleX(0);
        transform-origin: left;
        opacity: 0;
        transition:
          transform 1s ease,
          opacity 0.4s ease;
      }

      .show-box {
        transform: scaleX(1);
        opacity: 1;
      }

      .gp:hover .button-fill {
        transform: translateY(0);
      }

      .border-color {
        --tw-border-opacity: 1;
        border-color: rgb(39 39 39 / var(--tw-border-opacity, 1));

      .text-color {
        --tw-border-opacity: 1;

    <script>
      const ele = document.getElementById("project-container");
      const info = document.getElementById("project-info");

      function positionInfo() {
        if (window.innerWidth < 760) {
          const rect = ele.getBoundingClientRect();

          info.children[0].style.width = "150px";
          info.style.top = `${rect.y - info.offsetHeight - 10}px`;
          info.style.alignItems = "end";
          info.classList.add("text-color");
        } else {
          info.children[0].style.width = "";
          info.style.top = "";
          info.style.alignItems = "";
          info.classList.remove("text-color");
        }
      }

      positionInfo();

      window.addEventListener("resize", positionInfo);
    </script>
    <script type="text/javascript">
      (function (C, A, L) {
        let p = function (a, ar) {
          a.q.push(ar);
        };
        let d = C.document;
        C.Cal =
          C.Cal ||
          function () {
            let cal = C.Cal;
            let ar = arguments;
            if (!cal.loaded) {
              cal.ns = {};
              cal.q = cal.q || [];
              d.head.appendChild(d.createElement("script")).src = A;
              cal.loaded = true;
            }
            if (ar[0] === L) {
              const api = function () {
                p(api, arguments);
              };
              const namespace = ar[1];
              api.q = api.q || [];
              if (typeof namespace === "string") {
                cal.ns[namespace] = cal.ns[namespace] || api;
                p(cal.ns[namespace], ar);
                p(cal, ["initNamespace", namespace]);
              } else p(cal, ar);
              return;
            }
            p(cal, ar);
          };
      })(window, "https://app.cal.com/embed/embed.js", "init");
      Cal("init", "30min", { origin: "https://cal.com" });
      Cal.ns["30min"]("ui", {
        hideEventTypeDetails: false,
        layout: "month_view",
      });
    </script>
    <script>
      let rows = 5;
      let cols = 7;
      let total = rows * cols;

      const $container = $("#matrix");

      function buildGrid() {
        total = rows * cols;
        $container.empty();
        $container.css({
          "grid-template-columns": `repeat(${cols}, 1fr)`,
          "grid-template-rows": `repeat(${rows}, 1fr)`,
        });

        for (let i = 0; i < total; i++) {
          const $wrapper = $(
            '<div class="border border-[#272727] relative overflow-hidden"></div>',
          );
          const $overlay = $(
            '<div class="hidden-box absolute inset-0 bg-[#CB2957]"></div>',
          );
          $wrapper.append($overlay);
          $container.append($wrapper);
        }

        const $boxes = $("#matrix > div");
        const indices = Array.from({ length: total }, (_, i) => i);

        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        let counter = 100;
        if (window.innerWidth < 500) {
          counter = 50;
        } else if (window.innerWidth < 800) {
          counter = 70;
        }

        indices.forEach((index, i) => {
          const $overlay = $boxes.eq(index).find("div");
          setTimeout(() => {
            $overlay.addClass("show-box");
          }, i * counter);
        });
      }

      function updateLayout() {
        const width = window.innerWidth;
        if (width < 500) {
          rows = 12;
          cols = 6;
        } else if (width < 800) {
          rows = 8;
          cols = 7;
        } else {
          rows = 5;
          cols = 7;
        }
        buildGrid();
      }

      window.addEventListener("DOMContentLoaded", () => {
        updateLayout();
        setTimeout(() => {
          document.getElementById("matrix-wrapper").style.visibility = "hidden";
          document.querySelector(".group").style.visibility = "visible";
        }, 2300);
      });

      window.addEventListener("resize", () => {
        updateLayout();
      });
    </script>
  </body>
</html>

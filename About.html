        font-family: "Satoshi", sans-serif;
        font-weight: var(--text-weight);
        line-height: 1.5em;
        overflow: hidden;
      }

      .group {
        visibility: hidden;
      }

      .hidden-box {
        transform: scaleX(0);
        transform-origin: left;
        opacity: 0;
        transition:

          opacity 0.4s ease;
      }

      .show-box {

        opacity: 1;
      }

      .line {
        display: block;
        opacity: 0;
        transform: translateY(50px);
      }

    <script>
      let text = new SplitType(".display-title", { types: " lines" });

      gsap.fromTo(
        text.lines,
        { opacity: 0, y: 20 },
        {
          opacity: 1,
          y: 0,
          duration: 2,
          stagger: 0.08,
          ease: "power4.out",
        },
      );

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          location.reload();
        }, 200);
      });

      let th = localStorage.getItem("theme");
      if (th === "light") {
        document.body.classList.add("light-mode");
      }
    </script>

    <script>
      let rows = 5;
      let cols = 7;
      let total = rows * cols;

      const $container = $("#matrix");

      function buildGrid() {
        total = rows * cols;
        $container.empty();
        $container.css({
          "grid-template-columns": `repeat(${cols}, 1fr)`,
          "grid-template-rows": `repeat(${rows}, 1fr)`,
        });

        for (let i = 0; i < total; i++) {
          const $wrapper = $(
            '<div class="border border-[#272727] relative overflow-hidden"></div>',
          );
          const $overlay = $(
            '<div class="hidden-box absolute inset-0 bg-[#5F9598]"></div>',
          );
          $wrapper.append($overlay);
          $container.append($wrapper);
        }

        const $boxes = $("#matrix > div");
        const indices = Array.from({ length: total }, (_, i) => i);

        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        let counter = 100;
        if (window.innerWidth < 500) {
          counter = 50;
        } else if (window.innerWidth < 800) {
          counter = 70;
        }

        indices.forEach((index, i) => {
          const $overlay = $boxes.eq(index).find("div");
          setTimeout(() => {
            $overlay.addClass("show-box");
          }, i * counter);
        });
      }

      function updateLayout() {
        const width = window.innerWidth;
        if (width < 500) {
          rows = 12;
          cols = 6;
        } else if (width < 800) {
          rows = 8;
          cols = 7;
        } else {
          rows = 5;
          cols = 7;
        }
        buildGrid();
      }

      window.addEventListener("DOMContentLoaded", () => {
        updateLayout();
        setTimeout(() => {
          document.getElementById("matrix-wrapper").style.visibility = "hidden";
          document.querySelectorAll(".group").forEach((e) => {
            e.style.visibility = "visible";
          });
        }, 2300);
      });

      window.addEventListener("resize", () => {
        updateLayout();
      });
    </script>
